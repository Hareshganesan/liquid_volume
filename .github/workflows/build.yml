name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Debug APK
      run: |
        gradle assembleDebug --stacktrace 2>&1 | tee build_log.txt || true
        if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
          ERR_MSG=$(grep -i -E "e: |error:|FAILURE" build_log.txt | head -n 8 | tr '\n' ' ')
          echo "::error title=Build Error::$ERR_MSG"
          exit 1
        fi

    - name: Upload Build Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-failure-log
        path: build_log.txt

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: LiquidVolume-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Create or Update Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: "Liquid Volume Latest Build"
        body: |
          ### Liquid Volume - iOS 18 & ColorOS 16 Ultra Fluid Volume Center
          - Full-screen centered Master Audio Control Center
          - 4 independent stream sliders (Media, Ringtone, Alerts, Alarm)
          - 3-mode segmented sound bar (Silent, Vibrate, Ring)
          - Tap speaker icon to instant mute/restore
          - Swipe-off edge gesture to dismiss compact slider
          - Hardware GPU Gaussian blur (FLAG_BLUR_BEHIND / setBlurBehindRadius)
          - Full customization in app (Position, Length, Thickness, Timeout, Accent Color)
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
