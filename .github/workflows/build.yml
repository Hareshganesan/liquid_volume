name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Debug APK
      run: |
        gradle assembleDebug --stacktrace 2>&1 | tee build_log.txt || true
        if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
          ERR_MSG=$(grep -i -E "e: |error:|FAILURE" build_log.txt | head -n 8 | tr '\n' ' ')
          echo "::error title=Build Error::$ERR_MSG"
          exit 1
        fi

    - name: Upload Build Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-failure-log
        path: build_log.txt

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: LiquidVolume-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
